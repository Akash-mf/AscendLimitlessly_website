<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#11151a"/>
      <stop offset="100%" stop-color="#1c2b26"/>
    </linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2b20"/>
      <stop offset="100%" stop-color="#1c140f"/>
    </linearGradient>
    <linearGradient id="screenGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef6f2"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e9c6b"/>
      <stop offset="100%" stop-color="#15754f"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="0" y="560" width="1200" height="140" fill="url(#desk)"/>

  <!-- soft ambient blobs -->
  <circle cx="1020" cy="120" r="180" fill="#1e9c6b" opacity="0.08"/>
  <circle cx="180" cy="480" r="140" fill="#1e9c6b" opacity="0.06"/>

  <!-- Laptop base -->
  <g>
    <path d="M330 585 L870 585 L910 615 L290 615 Z" fill="#2b2f36"/>
    <rect x="640" y="592" width="40" height="8" rx="3" fill="#1c1f24"/>
  </g>

  <!-- Laptop screen -->
  <g>
    <rect x="360" y="230" width="480" height="358" rx="14" fill="#0e1013"/>
    <rect x="374" y="244" width="452" height="326" rx="4" fill="url(#screenGlow)"/>

    <!-- mock nav bar -->
    <rect x="390" y="258" width="18" height="18" rx="5" fill="#16a673"/>
    <rect x="414" y="261" width="70" height="7" rx="3" fill="#1a1d23"/>
    <rect x="414" y="271" width="46" height="5" rx="2" fill="#16a673"/>

    <rect x="560" y="262" width="40" height="6" rx="3" fill="#c9d0d6"/>
    <rect x="612" y="262" width="40" height="6" rx="3" fill="#c9d0d6"/>
    <rect x="664" y="262" width="40" height="6" rx="3" fill="#c9d0d6"/>
    <rect x="716" y="258" width="86" height="16" rx="8" fill="#16a673"/>

    <!-- mock hero copy -->
    <rect x="390" y="304" width="150" height="14" rx="3" fill="#1a1d23"/>
    <rect x="390" y="324" width="120" height="14" rx="3" fill="#1a1d23"/>
    <rect x="390" y="352" width="200" height="6" rx="3" fill="#8a92a0"/>
    <rect x="390" y="364" width="170" height="6" rx="3" fill="#8a92a0"/>
    <rect x="390" y="386" width="90" height="22" rx="11" fill="#16a673"/>

    <!-- decorative mockup graphic top-right -->
    <rect x="640" y="300" width="150" height="110" rx="10" fill="#e6f7f1"/>
    <circle cx="770" cy="325" r="14" fill="#bfe9d9"/>
    <rect x="655" y="360" width="120" height="8" rx="3" fill="#bfe9d9"/>
    <rect x="655" y="376" width="90" height="8" rx="3" fill="#bfe9d9"/>

    <!-- thumbnail row -->
    <rect x="390" y="430" width="98" height="70" rx="8" fill="#dfe6e2"/>
    <rect x="498" y="430" width="98" height="70" rx="8" fill="#dfe6e2"/>
    <rect x="606" y="430" width="98" height="70" rx="8" fill="#dfe6e2"/>
    <rect x="714" y="430" width="98" height="70" rx="8" fill="#dfe6e2"/>
    <rect x="390" y="508" width="98" height="7" rx="3" fill="#1a1d23"/>
    <rect x="498" y="508" width="98" height="7" rx="3" fill="#1a1d23"/>
    <rect x="606" y="508" width="98" height="7" rx="3" fill="#1a1d23"/>
    <rect x="714" y="508" width="98" height="7" rx="3" fill="#1a1d23"/>
  </g>

  <!-- keyboard -->
  <rect x="300" y="615" width="600" height="16" rx="4" fill="#20242a"/>

  <!-- plant right -->
  <g transform="translate(960,430)">
    <path d="M0 170 L60 170 L52 110 L8 110 Z" fill="#e9e6e0"/>
    <path d="M30 110 C30 40 -10 10 -30 -30 C10 10 30 60 30 110 Z" fill="url(#leaf)"/>
    <path d="M30 110 C30 30 60 0 90 -40 C60 10 40 60 30 110 Z" fill="url(#leaf)"/>
    <path d="M30 110 C30 50 10 10 0 -20 C25 10 35 60 30 110 Z" fill="#28b47c"/>
  </g>

  <!-- small plant left -->
  <g transform="translate(230,470)">
    <path d="M0 130 L46 130 L40 84 L6 84 Z" fill="#e9e6e0"/>
    <path d="M23 84 C23 30 -5 5 -20 -20 C5 5 23 40 23 84 Z" fill="url(#leaf)"/>
    <path d="M23 84 C23 20 45 0 65 -25 C40 5 28 40 23 84 Z" fill="url(#leaf)"/>
  </g>

  <!-- coffee cup -->
  <g transform="translate(1050,560)">
    <ellipse cx="35" cy="60" rx="38" ry="8" fill="#000000" opacity="0.15"/>
    <path d="M2 0 H68 L60 55 C60 66 8 66 8 55 Z" fill="#1c2024"/>
    <ellipse cx="35" cy="0" rx="33" ry="7" fill="#2b3036"/>
  </g>
</svg>
